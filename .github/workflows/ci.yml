name: CI

on:
  workflow_dispatch:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --workspace --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  gnome-extension:
    name: GNOME extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate metadata
        run: python3 -m json.tool gnome-extension/metadata.json

      - name: Check JavaScript syntax
        run: |
          node --input-type=module --check < gnome-extension/extension.js
          node --input-type=module --check < gnome-extension/prefs.js
          node --input-type=module --check < gnome-extension/protocol.js
          node --input-type=module --check < gnome-extension/error-contract.js

      - name: Test GNOME error contract
        run: node tests/gnome-error-contract.test.js
