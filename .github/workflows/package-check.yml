name: Package Check

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  gnome-extension-package:
    name: GNOME extension package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pack extension
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -lc '
              pacman -Syu --noconfirm gettext gnome-shell libarchive nodejs python
              python3 -m json.tool gnome-extension/metadata.json
              node --input-type=module --check < gnome-extension/extension.js
              node --input-type=module --check < gnome-extension/prefs.js
              node --input-type=module --check < gnome-extension/protocol.js
              node --input-type=module --check < gnome-extension/error-contract.js
              node tests/gnome-error-contract.test.js
              msgfmt -c -o /tmp/chargeguard.mo gnome-extension/po/zh_CN.po
              mkdir -p /tmp/chargeguard-extension-pack
              gnome-extensions pack --force --podir=po --gettext-domain=chargeguard --extra-source=protocol.js --extra-source=error-contract.js --out-dir=/tmp/chargeguard-extension-pack gnome-extension
              archive=/tmp/chargeguard-extension-pack/chargeguard@github.com.shell-extension.zip
              for file in metadata.json extension.js prefs.js protocol.js error-contract.js; do
                bsdtar -tf "$archive" | grep -Fx "$file"
              done
            '

  arch-package:
    name: Arch package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create local source archive
        run: |
          pkgver=$(awk -F= '/^pkgver=/{print $2}' packaging/arch/PKGBUILD)
          git archive --format=tar --prefix="ChargeGuard-${pkgver}/" HEAD \
            | gzip -n > "packaging/arch/chargeguard-${pkgver}.tar.gz"

      - name: Build with makepkg
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -lc '
              pacman -Syu --noconfirm cargo dbus gettext git polkit
              useradd -m builder
              chown -R builder:builder /workspace
              su builder -c "cd /workspace/packaging/arch && makepkg --printsrcinfo > .SRCINFO.generated"
              su builder -c "cd /workspace/packaging/arch && makepkg -f --cleanbuild --noconfirm"
            '
