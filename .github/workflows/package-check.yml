name: Package Check

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  gnome-extension-package:
    name: GNOME extension package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pack extension
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -lc '
              pacman -Syu --noconfirm gettext gnome-shell libarchive nodejs python
              python3 -m json.tool gnome-extension/metadata.json
              node --input-type=module --check < gnome-extension/extension.js
              node --input-type=module --check < gnome-extension/prefs.js
              node --input-type=module --check < gnome-extension/protocol.js
              node --input-type=module --check < gnome-extension/error-contract.js
              node tests/gnome-error-contract.test.js
              msgfmt -c -o /tmp/chargeguard.mo gnome-extension/po/zh_CN.po
              mkdir -p /tmp/chargeguard-extension-pack
              gnome-extensions pack --force --podir=po --gettext-domain=chargeguard --extra-source=protocol.js --extra-source=error-contract.js --out-dir=/tmp/chargeguard-extension-pack gnome-extension
              archive=/tmp/chargeguard-extension-pack/chargeguard@github.com.shell-extension.zip
              for file in metadata.json extension.js prefs.js protocol.js error-contract.js; do
                bsdtar -tf "$archive" | grep -Fx "$file"
              done
            '

  arch-package:
    name: Arch package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create local source archive
        run: |
          pkgver=$(awk -F= '/^pkgver=/{print $2}' packaging/arch/PKGBUILD)
          git archive --format=tar --prefix="ChargeGuard-${pkgver}/" HEAD \
            | gzip -n > "packaging/arch/chargeguard-${pkgver}.tar.gz"

      - name: Build with makepkg
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -lc '
              pacman -Syu --noconfirm cargo dbus gettext git groff man-db polkit systemd
              groff -ww -mandoc -Tutf8 docs/chargeguard.1 >/dev/null
              staged_man=/tmp/chargeguard-man
              install -Dm644 docs/chargeguard.1 "$staged_man/man1/chargeguard.1"
              MANPATH="$staged_man" man -w chargeguard | grep -Fx "$staged_man/man1/chargeguard.1"
              MANPATH="$staged_man" systemd-analyze verify packaging/systemd/chargeguardd.service
              useradd -m builder
              chown -R builder:builder /workspace
              su builder -c "cd /workspace/packaging/arch && makepkg --printsrcinfo > .SRCINFO.generated"
              cmp packaging/arch/.SRCINFO packaging/arch/.SRCINFO.generated
              su builder -c "cd /workspace/packaging/arch && makepkg -f --cleanbuild --noconfirm"
              backend_package=$(find packaging/arch -maxdepth 1 -type f -name "chargeguard-[0-9]*.pkg.tar.*" -print -quit)
              test -n "$backend_package"
              bsdtar -tf "$backend_package" | grep -Eq "^usr/share/man/man1/chargeguard\\.1(\\.gz)?$"
              if bsdtar -tf "$backend_package" | grep -q "^usr/share/man/man1/chargeguard\\.1\\.gz$"; then
                bsdtar -xOf "$backend_package" usr/share/man/man1/chargeguard.1.gz | gzip -dc | groff -ww -mandoc -Tutf8 >/dev/null
              else
                bsdtar -xOf "$backend_package" usr/share/man/man1/chargeguard.1 | groff -ww -mandoc -Tutf8 >/dev/null
              fi
              extracted=/tmp/chargeguard-package
              mkdir -p "$extracted"
              bsdtar -xf "$backend_package" -C "$extracted"
              "$extracted/usr/bin/chargeguard" help | grep -F "Usage: chargeguard <COMMAND>"
              for command in list current modes set doctor raw; do
                "$extracted/usr/bin/chargeguard" "$command" --help >/tmp/"$command".help
                grep -F "Usage: chargeguard $command" /tmp/"$command".help
                grep -Eq "^\\.(B|BR) $command" docs/chargeguard.1
              done
              grep -F "[DEVICE]" /tmp/current.help
              grep -F "[DEVICE]" /tmp/modes.help
              grep -F "[OPTIONS] <MODE>" /tmp/set.help
              grep -F -- "--device <DEVICE>" /tmp/set.help
              grep -F -- "--json" /tmp/doctor.help
              grep -F "[DEVICE]" /tmp/raw.help
              MANPATH="$extracted/usr/share/man" man -w chargeguard | grep -E "/usr/share/man/man1/chargeguard\\.1(\\.gz)?$"
              MANPATH="$extracted/usr/share/man" systemd-analyze verify "$extracted/usr/lib/systemd/system/chargeguardd.service"
            '
